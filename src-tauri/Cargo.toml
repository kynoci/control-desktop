[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Embedded, pure-Rust RDP client (no external mstsc/FreeRDP needed).
ironrdp = { version = "0.17", features = ["connector", "session", "graphics", "input", "pdu", "svc", "dvc", "displaycontrol", "cliprdr", "core"] }
ironrdp-tokio = "0.10"
# Graphics Pipeline (EGFX, MS-RDPEGFX). Required by GNOME Remote Desktop, which has
# no legacy bitmap output path — see plan-egfx.md. Default features only: H.264 sits
# behind the optional `openh264*` features and would need a C toolchain.
ironrdp-egfx = { version = "0.3", default-features = false }
# Bulk decompressor. Needed to rebuild the fast-path processor after a server
# Deactivate-All when RDP bulk compression was negotiated — see `reactivate()`.
ironrdp-bulk = "0.1"
# Embedded, pure-Rust VNC (RFB) client. ZRLE uses flate2/miniz_oxide (pure Rust);
# keep flate2's default backend (do NOT enable its `zlib` feature) to preserve the
# no-C-toolchain build. See plan-vnc.md §3.
vnc-rs = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
# Use the `ring` crypto backend (not aws-lc) to avoid a C/NASM toolchain at build time.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
tokio-util = "0.7"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

# Vendored copy of ironrdp-connector 0.10.0 with a one-line fix: also advertise
# ClientEarlyCapabilityFlags::SUPPORT_DYN_VC_GFX_PROTOCOL, so servers that only
# emit over the Graphics Pipeline (notably gnome-remote-desktop) will hand us a
# desktop instead of closing the connection at Capabilities Exchange. Upstream
# hardcodes the flag list with no opt-in — see plan-egfx.md.
#
# The previous patch here (tolerate a Server Deactivate All PDU during Capabilities
# Exchange) landed upstream in 0.10 and is no longer carried locally.
# Vendored copy of ironrdp-graphics 0.9.0 with a one-function fix: the RemoteFX
# Progressive tile reconstruction used the wrong YCbCr scale, saturating every
# real server frame (mid-tones to black, highlights to red). See plan-egfx.md.
[patch.crates-io]
ironrdp-connector = { path = "vendor/ironrdp-connector" }
ironrdp-graphics = { path = "vendor/ironrdp-graphics" }

